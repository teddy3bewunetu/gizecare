# GizeCare — Snap Store packaging
#
# One-time setup (on your machine):
#   sudo snap install snapcraft --classic
#   sudo snap install lxd
#   sudo lxd init --auto
#   sudo usermod -aG lxd "$USER"   # then log out/in
#   snapcraft login
#   snapcraft register gizecare     # once, if the name is free
#
# Build & publish:
#   snapcraft --use-lxd
#   snapcraft upload --release=edge *.snap
#
# Local test before uploading:
#   sudo snap install ./gizecare_*.snap --dangerous
#   gizecare

name: gizecare
base: core22
version: '0.1.0'
summary: GizeCare — your workday, one place
description: |
  Offline-first workday hub for freelancers, engineers, and designers:
  time tracking, projects, notes, documents, calendar, Gmail, and Telegram
  without juggling separate apps.

grade: stable
confinement: strict

architectures:
  - build-on: amd64

slots:
  dbus-gizecare:
    interface: dbus
    bus: session
    name: com.gizecare.gizecare

apps:
  gizecare:
    # Wrapper forces gnome-platform Mesa after desktop-launch (see bin/gizecare-launch).
    command: bin/gizecare-launch
    extensions: [gnome]
    plugs:
      - network
      - network-bind
      - home
      - removable-media
      - audio-playback
      - audio-record
      - browser-support
      - password-manager-service
      - shared-memory
      - process-control
    slots:
      - dbus-gizecare

parts:
  # Pin Flutter to the same release used for local development (3.38.3 / Dart
  # 3.10.1). The snapcraft "flutter" plugin only tracks channel tips, and a
  # newer stable breaks flutter_quill / pdfrx in this project.
  flutter-sdk:
    plugin: nil
    source: https://github.com/flutter/flutter.git
    source-tag: '3.38.3'
    source-depth: 1
    override-build: |
      set -eux
      mkdir -p "$CRAFT_PART_INSTALL/usr/libexec"
      cp -a "$CRAFT_PART_SRC" "$CRAFT_PART_INSTALL/usr/libexec/flutter"
      mkdir -p "$CRAFT_PART_INSTALL/usr/bin"
      ln -sf ../libexec/flutter/bin/flutter "$CRAFT_PART_INSTALL/usr/bin/flutter"
      ln -sf ../libexec/flutter/bin/dart "$CRAFT_PART_INSTALL/usr/bin/dart"
      "$CRAFT_PART_INSTALL/usr/bin/flutter" config --no-analytics --enable-linux-desktop
      "$CRAFT_PART_INSTALL/usr/bin/flutter" precache --linux
    build-packages:
      - clang
      - cmake
      - curl
      - git
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
    # SDK is only needed at build time — do not ship it in the snap.
    override-prime: ''

  gizecare:
    after: [flutter-sdk]
    source: .
    plugin: nil
    override-build: |
      set -eux
      # Host `flutter run` leaves CMakeCache with absolute host paths.
      rm -rf build
      export PATH="$CRAFT_STAGE/usr/bin:$PATH"
      flutter config --no-analytics --enable-linux-desktop
      flutter pub get
      flutter build linux --release --target=lib/main.dart
      cp -a build/linux/*/release/bundle/. "$CRAFT_PART_INSTALL/"
      install -D -m 755 snap/local/gizecare-launch \
        "$CRAFT_PART_INSTALL/bin/gizecare-launch"
    build-packages:
      - clang
      - cmake
      - libgtk-3-dev
      - libwebkit2gtk-4.1-dev
      - libsecret-1-dev
      - libmpv-dev
      - ninja-build
      - pkg-config
    stage-packages:
      - libwebkit2gtk-4.1-0
      - libjavascriptcoregtk-4.1-0
      - libsecret-1-0
      # media_kit_video links against libmpv (PkgConfig::mpv).
      # libmpv → pocketsphinx → sphinxbase needs BLAS/LAPACK.
      - libmpv1
      - libblas3
      - liblapack3
    override-prime: |
      set -eux
      craftctl default
      # Debian puts BLAS/LAPACK under blas/ and lapack/ and exposes
      # libblas.so.3 / liblapack.so.3 via update-alternatives. Snapcraft
      # stages the packages but does not recreate those soname links, so
      # the binary fails at startup with "libblas.so.3: cannot open...".
      libdir="$CRAFT_PRIME/usr/lib/$CRAFT_ARCH_TRIPLET"
      ln -sfn blas/libblas.so.3 "$libdir/libblas.so.3"
      ln -sfn lapack/liblapack.so.3 "$libdir/liblapack.so.3"
      # libmpv (and friends) pull Mesa/GL into the snap. Those conflict with
      # the gnome extension's platform DRI stack and crash at startup with
      # "libEGL fatal: did not find extension DRI_Mesa version 1". Graphics
      # must come from gnome-platform + the opengl plug, not stage-packages.
      rm -f "$libdir"/libEGL.so* "$libdir"/libEGL_mesa.so* \
            "$libdir"/libGL.so* "$libdir"/libGLESv2.so* \
            "$libdir"/libGLX.so* "$libdir"/libGLX_*.so* \
            "$libdir"/libGLdispatch.so* "$libdir"/libglapi.so* \
            "$libdir"/libgbm.so*
      rm -rf "$libdir/dri" "$CRAFT_PRIME/usr/share/glvnd"
      # Size: Mesa also stages LLVM (~110MB) for lavapipe; nothing else in
      # the snap links it after dri/EGL are removed. FFmpeg pulls flite TTS
      # voice banks (~25MB) that media_kit never needs.
      rm -f "$libdir"/libLLVM*
      rm -f "$libdir"/libflite*
      rm -rf "$CRAFT_PRIME/usr/lib/aspell" \
             "$CRAFT_PRIME/usr/share/icons" \
             "$CRAFT_PRIME/usr/share/locale" \
             "$CRAFT_PRIME/usr/share/fonts" \
             "$CRAFT_PRIME/usr/share/hunspell" \
             "$CRAFT_PRIME/usr/share/dictionaries-common" \
             "$CRAFT_PRIME/usr/share/lintian" \
             "$CRAFT_PRIME/usr/share/doc" \
             "$CRAFT_PRIME/usr/share/man" \
             "$CRAFT_PRIME/usr/share/bug"
      # Drop debug symbols from Flutter/native libs (safe for release).
      find "$CRAFT_PRIME" -type f \( -name '*.so' -o -name '*.so.*' -o -name gizecare \) \
        -exec strip --strip-unneeded {} + 2>/dev/null || true
    prime:
      - -usr/include
      - -usr/share/doc
      - -usr/share/man
      - -usr/share/icons
      - -usr/share/locale
      - -usr/share/fonts
      - -usr/share/lintian
      - -usr/share/bug
