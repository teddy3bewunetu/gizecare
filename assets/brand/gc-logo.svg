<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <!-- 
ÜCare mark: open ring + needle + pixel trail. Replace this file with your export anytime. -->
  <defs>
    <linearGradient id="ringShade" x1="40" y1="60" x2="120" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#009DFE"/>
      <stop offset="0.55" stop-color="#009DFE"/>
      <stop offset="1" stop-color="#006BB8"/>
    </linearGradient>
  </defs>

  <!-- Outer open ring (gap at ~13 o'clock) -->
  <path
    d="M176.5 58.5
       C155 41.5 128.5 35 102 41.5
       C58 52.5 30 92 34.5 137.5
       C39.5 188 84.5 226 135.5 221.5
       C170 218.5 199 198.5 213 169.5"
    stroke="url(#ringShade)"
    stroke-width="34"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner darker crescent for depth (left side) -->
  <path
    d="M78 78
       C52 104 46 145 62 176
       C78 207 112 224 145 220"
    stroke="#005A9E"
    stroke-width="10"
    stroke-linecap="round"
    opacity="0.55"
  />

  <!-- Center needle toward the gap -->
  <g transform="translate(128 128) rotate(42)">
    <rect x="-8" y="-10" width="16" height="78" rx="8" fill="#009DFE"/>
    <circle cx="0" cy="0" r="11" fill="#009DFE"/>
  </g>

  <!-- Pixel trail -->
  <g fill="#009DFE">
    <rect x="188" y="62" width="14" height="14" rx="1.5"/>
    <rect x="206" y="54" width="11" height="11" rx="1.5"/>
    <rect x="198" y="80" width="12" height="12" rx="1.5"/>
    <rect x="218" y="70" width="10" height="10" rx="1.5"/>
    <rect x="228" y="50" width="9" height="9" rx="1.5"/>
    <rect x="214" y="92" width="9" height="9" rx="1.5"/>
    <rect x="236" y="66" width="8" height="8" rx="1.5"/>
    <rect x="224" y="108" width="8" height="8" rx="1.5"/>
    <rect x="242" y="84" width="7" height="7" rx="1.5"/>
    <rect x="232" y="40" width="7" height="7" rx="1.5"/>
    <rect x="246" y="56" width="6" height="6" rx="1"/>
  </g>
</svg>
