# Optional CI: build + publish on main / v*.*.* tags.
# For a simple local release, see comments at the top of snap/snapcraft.yaml.
#
# GitHub secret SNAPCRAFT_STORE_CREDENTIALS — export once:
#   snapcraft export-login --snaps=gizecare \
#     --channels=edge,candidate,stable \
#     --acls=package_upload,package_release \
#     snapcraft-creds.txt
# Then: Settings → Secrets → Actions → SNAPCRAFT_STORE_CREDENTIALS

name: Snapcraft

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up LXD
        run: |
          sudo lxd init --auto
          sudo usermod --append --groups lxd "$USER"
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxc version
          sudo iptables -I DOCKER-USER -j ACCEPT || true

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build snap
        run: |
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- \
            snapcraft --use-lxd

      - name: Locate snap
        id: snap
        run: echo "snap=$(ls -1 ./*.snap | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'candidate' || 'edge' }}
