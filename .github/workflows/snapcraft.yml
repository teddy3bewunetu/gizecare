# Build + publish on main / v*.*.* tags.
#
# Store login (use Actions *Variables* — Secrets were not visible to this job
# reliably for multiline export-login output):
#   SNAPCRAFT_STORE_CREDENTIALS  → Settings → Secrets and variables → Actions → Variables
#
# App credentials (Variables or Secrets; baked into the snap via --dart-define):
#   GOOGLE_CALENDAR_CLIENT_ID / GOOGLE_CALENDAR_CLIENT_SECRET
#   SLACK_CLIENT_ID / SLACK_CLIENT_SECRET
#   TELEGRAM_API_ID / TELEGRAM_API_HASH
#
# See docs/snap_setup.md

name: Snapcraft

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    # Prefer vars.* for store creds (repo convention). Fall back to secrets.*.
    # Map to env first — secrets/vars cannot be used directly in `if:`.
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ vars.SNAPCRAFT_STORE_CREDENTIALS || secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      GOOGLE_CALENDAR_CLIENT_ID: ${{ vars.GOOGLE_CALENDAR_CLIENT_ID || secrets.GOOGLE_CALENDAR_CLIENT_ID }}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${{ vars.GOOGLE_CALENDAR_CLIENT_SECRET || secrets.GOOGLE_CALENDAR_CLIENT_SECRET }}
      SLACK_CLIENT_ID: ${{ vars.SLACK_CLIENT_ID || secrets.SLACK_CLIENT_ID }}
      SLACK_CLIENT_SECRET: ${{ vars.SLACK_CLIENT_SECRET || secrets.SLACK_CLIENT_SECRET }}
      TELEGRAM_API_ID: ${{ vars.TELEGRAM_API_ID || secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ vars.TELEGRAM_API_HASH || secrets.TELEGRAM_API_HASH }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up LXD
        run: |
          sudo lxd init --auto
          sudo usermod --append --groups lxd "$USER"
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- lxc version
          sudo iptables -I DOCKER-USER -j ACCEPT || true

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Write dart-defines for Flutter (from Actions vars/secrets)
        run: |
          mkdir -p snap/local
          : > snap/local/ci_dart_defines.env
          add_define() {
            local key="$1"
            local val="$2"
            if [ -n "$val" ]; then
              printf '%s=%s\n' "$key" "$val" >> snap/local/ci_dart_defines.env
            fi
          }
          add_define GOOGLE_CALENDAR_CLIENT_ID "${GOOGLE_CALENDAR_CLIENT_ID}"
          add_define GOOGLE_CALENDAR_CLIENT_SECRET "${GOOGLE_CALENDAR_CLIENT_SECRET}"
          add_define SLACK_CLIENT_ID "${SLACK_CLIENT_ID}"
          add_define SLACK_CLIENT_SECRET "${SLACK_CLIENT_SECRET}"
          add_define TELEGRAM_API_ID "${TELEGRAM_API_ID}"
          add_define TELEGRAM_API_HASH "${TELEGRAM_API_HASH}"
          echo "Wrote $(grep -c '=' snap/local/ci_dart_defines.env || true) dart-define entries (values redacted)."

      - name: Build snap
        run: |
          sudo --user "$USER" --preserve-env --preserve-env=PATH -- env -- \
            snapcraft pack --use-lxd

      - name: Scrub CI dart-defines from workspace
        if: always()
        run: rm -f snap/local/ci_dart_defines.env

      - name: Locate snap
        id: snap
        run: echo "snap=$(ls -1 ./*.snap | head -n1)" >> "$GITHUB_OUTPUT"

      - name: Upload snap artifact
        uses: actions/upload-artifact@v4
        with:
          name: gizecare-snap
          path: ${{ steps.snap.outputs.snap }}

      - name: Publish to Snap Store
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        env:
          # Re-assert on the step (Variables, with Secrets fallback).
          SNAPCRAFT_STORE_CREDENTIALS: ${{ vars.SNAPCRAFT_STORE_CREDENTIALS || secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.snap.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/v') && 'candidate' || 'edge' }}
